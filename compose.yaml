name: api-platform
services:
  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GATEWAY_URL: http://gateway:4000
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  gateway:
    build:
      context: .
      target: runtime
    environment:
      HOST: 0.0.0.0
      DB_MODE: postgres
      RATE_LIMIT_MODE: redis
      DATABASE_URL: postgresql://platform:platform_local@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      USERS_URL: http://users:4001
      PRODUCTS_URL: http://products:4002
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-demo-123}
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      users:
        condition: service_started
      products:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  users:
    build:
      context: .
      target: runtime
    command: ['node', 'services/users/server.mjs']
    environment:
      HOST: 0.0.0.0
  products:
    build:
      context: .
      target: runtime
    command: ['node', 'services/products/server.mjs']
    environment:
      HOST: 0.0.0.0
  checks:
    profiles: ['tools']
    build:
      context: .
      target: runtime
    command: ['npm', 'test']
    environment:
      TEST_DATABASE_URL: postgresql://platform:platform_local@postgres:5432/platform
      TEST_REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  load-test:
    profiles: ['tools']
    image: grafana/k6:1.3.0
    entrypoint: ['k6']
    command: ['run', '/scripts/load-test.js']
    volumes:
      - ./scripts/load-test.js:/scripts/load-test.js:ro
    environment:
      GATEWAY_URL: http://gateway:4000
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-demo-123}
    depends_on:
      gateway:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_local
      POSTGRES_DB: platform
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform -d platform']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
